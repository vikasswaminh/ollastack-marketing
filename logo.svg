<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 48" fill="none" role="img" aria-label="ollastack">
  <defs>
    <!-- Top layer gradient -->
    <linearGradient id="topPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="topRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <!-- Middle layer gradient -->
    <linearGradient id="midPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <!-- Bottom layer gradient -->
    <linearGradient id="botPlateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- ================= 3D ISOMETRIC STACK EMBLEM ================= -->
  <g transform="translate(2, 4)">
    <!-- LAYER 3: BOTTOM BASE (DARK NAVY / INK WITH WHITE RIM) -->
    <!-- White Top Highlight Rim -->
    <path d="M 20 28 C 18.5 27.2, 9.5 22.8, 8 21.8 C 6.8 20.8, 6.8 19.2, 8 18.2 C 9.5 17.2, 18.5 12.8, 20 12 C 21.5 11.2, 23.5 11.2, 25 12 C 26.5 12.8, 35.5 17.2, 37 18.2 C 38.2 19.2, 38.2 20.8, 37 21.8 C 35.5 22.8, 26.5 27.2, 25 28 C 23.5 28.8, 21.5 28.8, 20 28 Z" fill="#FFFFFF" transform="translate(0, 8)"/>
    <!-- Bottom Extrusion -->
    <path d="M 7.2 28.5 L 7.2 32.5 C 7.2 34.5, 8.8 35.8, 10.5 36.8 L 20.5 41.8 C 21.8 42.5, 23.2 42.5, 24.5 41.8 L 34.5 36.8 C 36.2 35.8, 37.8 34.5, 37.8 32.5 L 37.8 28.5 C 37.8 30.2, 36.2 31.5, 34.5 32.5 L 24.5 37.5 C 23.2 38.2, 21.8 38.2, 20.5 37.5 L 10.5 32.5 C 8.8 31.5, 7.2 30.2, 7.2 28.5 Z" fill="url(#botPlateGrad)"/>
    <path d="M 20 35 C 18.5 34.2, 10 30, 8.5 29 C 7.2 28, 7.2 26.5, 8.5 25.5 C 10 24.5, 18.5 20.5, 20 19.5 C 21.5 18.7, 23.5 18.7, 25 19.5 C 26.5 20.5, 35 24.5, 36.5 25.5 C 37.8 26.5, 37.8 28, 36.5 29 C 35 30, 26.5 34.2, 25 35 C 23.5 35.8, 21.5 35.8, 20 35 Z" fill="#0F172A"/>

    <!-- LAYER 2: MIDDLE BAND (CRIMSON RED) -->
    <path d="M 7.2 19 L 7.2 23.2 C 7.2 25, 8.8 26.2, 10.5 27.2 L 20.5 32.2 C 21.8 32.9, 23.2 32.9, 24.5 32.2 L 34.5 27.2 C 36.2 26.2, 37.8 25, 37.8 23.2 L 37.8 19 C 37.8 20.8, 36.2 22, 34.5 23 L 24.5 28 C 23.2 28.7, 21.8 28.7, 20.5 28 L 10.5 23 C 8.8 22, 7.2 20.8, 7.2 19 Z" fill="url(#midPlateGrad)"/>

    <!-- LAYER 1: TOP SQUIRCLE PLATE (VIBRANT RED WITH INNER CUTOUT) -->
    <!-- Top Rim Extrusion -->
    <path d="M 7.2 10.5 L 7.2 14.8 C 7.2 16.5, 8.8 17.8, 10.5 18.8 L 20.5 23.8 C 21.8 24.5, 23.2 24.5, 24.5 23.8 L 34.5 18.8 C 36.2 17.8, 37.8 16.5, 37.8 14.8 L 37.8 10.5 C 37.8 12.2, 36.2 13.5, 34.5 14.5 L 24.5 19.5 C 23.2 20.2, 21.8 20.2, 20.5 19.5 L 10.5 14.5 C 8.8 13.5, 7.2 12.2, 7.2 10.5 Z" fill="url(#topRimGrad)"/>
    <!-- Outer Top Surface -->
    <path d="M 20 14 C 18.5 13.2, 9.5 8.8, 8 7.8 C 6.8 6.8, 6.8 5.2, 8 4.2 C 9.5 3.2, 18.5 -1.2, 20 -2 C 21.5 -2.8, 23.5 -2.8, 25 -2 C 26.5 -1.2, 35.5 3.2, 37 4.2 C 38.2 5.2, 38.2 6.8, 37 7.8 C 35.5 8.8, 26.5 13.2, 25 14 C 23.5 14.8, 21.5 14.8, 20 14 Z" fill="url(#topPlateGrad)" transform="translate(0, 5)"/>
    <!-- Center Cutout Hole (Dark Depth) -->
    <path d="M 20.5 12.2 C 19.8 11.8, 15.2 9.4, 14.4 9 C 13.8 8.6, 13.8 7.8, 14.4 7.4 C 15.2 7, 19.8 4.6, 20.5 4.2 C 21.2 3.8, 22.2 3.8, 22.8 4.2 C 23.5 4.6, 28.1 7, 28.9 7.4 C 29.5 7.8, 29.5 8.6, 28.9 9 C 28.1 9.4, 23.5 11.8, 22.8 12.2 C 22.2 12.6, 21.2 12.6, 20.5 12.2 Z" fill="#09090B"/>
  </g>

  <!-- ================= WORDMARK: OLLASTACK (BLACK & RED) ================= -->
  <text x="50" y="33" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="31" 
        font-weight="800" 
        letter-spacing="-0.035em">
    <tspan fill="#09090B">olla</tspan><tspan fill="#DC2626">stack</tspan>
  </text>
</svg>
